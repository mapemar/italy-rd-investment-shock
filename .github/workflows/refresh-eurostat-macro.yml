name: Refresh Eurostat macro data
on:
  push:
    paths:
      - 'scripts/refresh_eurostat_macro.py'
      - '.github/workflows/refresh-eurostat-macro.yml'
      - '.gitignore'
  workflow_dispatch:
  schedule:
    - cron: "17 6 15 * *"
permissions:
  contents: write
concurrency:
  group: eurostat-macro-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Eurostat series
        run: python scripts/refresh_eurostat_macro.py
      - name: Commit refreshed datasets
        run: |
          git add data/processed/eurostat_rd_intensity_italy_2010_2024.csv data/processed/eurostat_gdp_italy_2010_2024.csv data/processed/eurostat_macro_panel_italy_2010_2024.csv
          if git diff --cached --quiet; then
            echo "No Eurostat data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Eurostat R&D intensity and GDP series"
          git pull --rebase origin main
          git push

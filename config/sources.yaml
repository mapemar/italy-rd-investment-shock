# Initial source catalogue. Add exact document URLs and dataset identifiers as they are verified.
project:
  geography: IT
  historical_coverage_start: 2015
  historical_coverage_end: 2024
  constant_price_reference_year: 2019
  retain_nominal_series: true
  policy_scope:
    core: pnrr_plus_directly_associated_national_cofinancing
    exclude_unrelated_national_measures: true
    optional_eu_programmes:
      enabled: false
      programmes:
        - cohesion_policy
        - eic
  shock_horizon_start: 2021
  shock_horizon_end: 2030

source_families:
  pnrr:
    commission_country_page: https://reforms-investments.ec.europa.eu/recovery-and-resilience-facility-1/country-pages/italys-recovery-and-resilience-plan_en
    original_cid_2021:
      council_register_document_number: 10160/21
      annex_document_number: ST 10160 2021 ADD 1 REV 2
      source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=consil:ST_10160_2021_ADD_1_REV_2
      cid_source_url: https://data.consilium.europa.eu/doc/document/ST-10160-2021-INIT/en/pdf
    latest_cid_2026:
      adopted_version: August 2026
      council_document: ST 12357/26
      annex_document: ST 12357/26 ADD 1
      cid_url: https://reforms-investments.ec.europa.eu/document/download/e723ee8a-267f-4e5b-b857-ead3be9dddbf_en?filename=COM_2026_434_1_EN_ACT_part1_v3.pdf
      annex_url: https://reforms-investments.ec.europa.eu/document/download/0531155b-8019-459a-8892-7bb5a1cc5a69_en?filename=COM_2026_434_1_EN_annexe_proposition_cp_part1_v4.pdf
      source_page: https://reforms-investments.ec.europa.eu/recovery-and-resilience-facility-1/country-pages/italys-recovery-and-resilience-plan_en
      note: Use the adopted Council Implementing Decision and annex, not only the Commission proposal. Preserve the March 2026 and intermediate revisions for version history.
    source_documents:
      - name: Original Italian PNRR
        institution: Government of Italy
        expected_material: plan, annexes, measure tables
      - name: Council Implementing Decision 2021
        institution: Council of the European Union
        expected_material: CID and annexes
      - name: Revised Italian PNRR
        institution: Government of Italy
        expected_material: revised plan and annexes
      - name: Council Implementing Decision 2026
        institution: Council of the European Union
        expected_material: revised CID and annexes
  other_eu_programmes:
    cohesion_policy:
      enabled_by_default: false
      expected_material: programmes, priorities, calls, selected operations, payments and R&D-relevant beneficiary expenditure
    eic:
      enabled_by_default: false
      expected_material: EIC Pathfinder, Transition and Accelerator grant/equity components, award and beneficiary data
  implementation:
    italiadomani:
      portal: https://www.italiadomani.gov.it/
      open_data_catalogue_navigation: locate_from_portal_navigation
      expected_material: measures, projects, implementing bodies, tenders, awardees, calls and notices, financial framework, milestones and targets, implementation progress

    mimit_implementation_report_2025:
      name: MIMIT PNRR monitoring report, September 2025 (updated PDF)
      source_url: https://www.mimit.gov.it/images/stories/documenti/allegati/pnrr/30092025_Mimit_Report_Semestrale_aggiornato_Def_061125.pdf
      expected_material: ReGiS implementation tables, project counts, activated resources, IPCEI concessions, sub-investment workstreams, PoC and UTT implementation
      vintage: September 2025 report; tables dated June-August 2025
      note: Allocation, project value, activated resources and concessions are not R&D expenditure. Keep each concept and date separate.
    mimit_ipcei_participant_register:
      original_decree_url: https://www.mimit.gov.it/images/stories/normativa/mimit.AOO_PIT.REGISTRO_UFFICIALEU.0215132.28-06-2023_2.pdf
      updated_decree_url: https://www.mimit.gov.it/images/stories/normativa/DD_4_novembre_2025_per_web.pdf
      expected_material: Participant legal names, IPCEI category, status and CUP; updated 4 November 2025 list supersedes 28 June 2023 list for current beneficiary register
      note: Participant listing is not proof of concession or R&D expenditure; match CUP to concession decrees and project cost reports.
    mimit_ipcei_microelectronics_2:
      source_url: https://www.mimit.gov.it/it/incentivi/ipcei-microelettronica-2
      expected_material: PNRR and national co-financing, concession decrees, eligible beneficiaries, reporting and project implementation
    mimit_ipcei_cloud:
      source_url: https://www.mimit.gov.it/it/incentivi/ipcei-infrastrutture-e-servizi-cloud-cis
      expected_material: PNRR and national co-financing, eligible beneficiaries, concession and implementation data
    mimit_pnrr_incentives:
      portal: https://www.mimit.gov.it/it/pnrr/agevolazioni-pnrr
      expected_material: R&D tax credit, business incentives, venture-capital funds and PNRR implementation information
  legislation_and_budget:
    - name: Italian Budget Laws
      institution: Government of Italy
      expected_material: laws, budget tables, financial annexes
    - name: Implementing legislation
      institution: Relevant Italian administrations
      expected_material: decrees, allocation acts, implementing rules
  accounting:
    esa_2010_eurostat_methodology: https://ec.europa.eu/eurostat/web/government-finance-statistics/methodology
    manual_on_government_deficit_and_debt_2022: https://ec.europa.eu/eurostat/documents/3859598/16029761/KS-GQ-23-002-EN-N.pdf
    mef_rgs_openbdap_cash_and_national_accounts: https://openbdap.rgs.mef.gov.it/Home/ContiPubbliciContabilitaNazionale
    note: Preserve cash, commitments, ESA accrual recognition and beneficiary R&D performance as separate timing fields.
  statistics:
    eurostat:
      verified_datasets:
        - rd_e_gerdtot
        - rd_e_gerdfund
        - rd_e_fundgerd
        - rd_p_persocc
        - gba_nabsfin07
      candidate_datasets:
        - rd_e_gerdact
      note: Verified identifiers and current coverage are documented in docs/literature_review/italy_macro_rd_data_availability_round5.md. Confirm all dimensions, units, flags and annual cross-breakdown coverage before extraction. Do not assume detailed R&D type/cost dataset codes without verification.
    oecd:
      candidate_topics:
        - GERD
        - BERD
        - GOVERD
        - HERD
        - GERD by source of funds
        - GERD by type of R&D
        - GBARD
        - GTARD
        - Implied marginal R&D tax subsidy rates / B-index
      note: GTARD and tax-wedge series are separate from Eurostat GERD/GBARD; resolve exact Italy-specific series, coverage and vintage from OECD R&D Tax Incentives Database.
  financial_instruments:
    - CDP
    - CDP Venture Capital
    - European Investment Bank
    - InvestEU

  pnrr_2026_budget_reconciliation:
    camera_dl_19_2026_budget_revision_and_ministry_economies: https://documenti.camera.it/leg19/dossier/testi/D26019avol2.htm
    camera_dl_162_2026_measure_level_economies: https://documenti.camera.it/leg19/dossier/testi/D26162.htm
    note: 2026 Budget Law returns, national expenditure relabelled as PNRR, and ministry-/measure-level economies must be reconciled separately; do not infer R&D performance from economy data.
  state_budget_and_execution:
    openbdap_catalogue: https://bdap-opendata.rgs.mef.gov.it/parola-chiave/capitolo
    openbdap_historical_expenditure_mission_programme_macroaggregate: https://bdap-opendata.rgs.mef.gov.it/content/rendiconto-pubblicato-serie-storica-spese-aggregato-missione-programma-e-macroaggregato-0?metadati=showall
    openbdap_2025_final_accounts_chapters: https://bdap-opendata.rgs.mef.gov.it/content/2025-rendiconto-pubblicato-elaborabile-spese-capitolo?metadati=showall
    openbdap_2026_budget_law_chapters: https://bdap-opendata.rgs.mef.gov.it/content/2026-legge-di-bilancio-pubblicata-elaborabile-spese-capitolo?metadati=showall
    camera_pnrr_treasury_and_reporting_monitoring_2026: https://documenti.camera.it/leg19/dossier/testi/CP0926R.htm
    camera_2025_final_accounts_2026_adjustment: https://documenti.camera.it/leg19/dossier/testi/BI0295.htm
    istat_gbard_report_2025: https://www.istat.it/wp-content/uploads/2025/09/REPORT_RS_2025.pdf
    istat_rd_release_2024_2026: https://www.istat.it/comunicato-stampa/la-ricerca-e-lo-sviluppo-in-italia-anni-2024-2026/
    expected_material: annual budget-law and final-account datasets by chapter, Treasury-account flows, Group 286 special-account transfers, ReGiS expenditure reporting and ISTAT GBARD
    note: State budget, Treasury flows, ESA general-government accounts and R&D performed are distinct views. Eliminate internal transfers and never treat cash transfers as final expenditure or R&D.
evidence_requirements:
  store_retrieval_date: true
  store_document_version: true
  store_page_or_provision: true
  store_source_url: true
  store_unit_and_price_basis: true
  require_human_validation_for_final_estimates: true

  venture_capital_and_startups:
    mimit_vc_funds_overview: https://www.mimit.gov.it/it/incentivi/venture-capital-fondi-per-la-transizione-ecologica-e-digitale
    digital_transition_fund_pnrr: https://www.mimit.gov.it/it/pnrr/progetti-pnrr/pnrr-finanziamento-di-start-up
    green_transition_fund_pnrr: https://www.mimit.gov.it/it/pnrr/progetti-pnrr/pnrr-supporto-a-start-up-e-venture-capital-attivi-nella-transizione-ecologica
    cdp_digital_transition_fund: https://www.cdpventurecapital.it/it/fondo.page?contentId=FND50559
    cdp_green_transition_fund: https://www.cdpventurecapital.it/en/fondo.page?contentId=FND50565
    law_193_2024_article_33: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2024-12-16;193
    institutional_vc_reform_senate_dossier: https://www.senato.it/show-doc?id=1463045&leg=19&part=dossier_dossier1-sezione_sezione8-h2_h22&tipodoc=DOSSIER
    mimit_made_in_italy_2030: https://www.mimit.gov.it/images/stories/documenti/Made_in_Italy_2030_-_Per_una_nuova_strategia_industriale.pdf
    note: DTF initially had EUR 300m and was scaled up by EUR 100m in the December 2023 CID to EUR 400m; some MIMIT overview pages retain the original EUR 300m. The DTF indirect investment call requires private investors to commit at least an amount equal to the DTF investment, i.e. cumulative minimum leverage of 1x1; do not generalise this condition to direct investments without the relevant call. VC is not automatically R&D; only evidenced portfolio-company R&D performed in Italy may enter the R&D shock.

  rd_tax_credit:
    istat_2015_2020:
      url: https://www.istat.it/comunicato-stampa/gli-incentivi-alle-imprese-per-la-ricerca-e-sviluppo-anni-2015-2020/
      content: Istat analysis of tax-credit and Patent Box effects, 2015-2020; combined tax-relief ratios only in press note.
    mef_bdi_mimit_transizione_40:
      url: https://img.innovationpost.it/wp-content/uploads/2024/11/29161253/Gli-incentivi-in-investimenti-4.0-una-valutazione-dellimpatto-della-misura.pdf
      content: 2020-2022 tax returns; R&D&I category includes R&D, technological innovation and design; 2022 data provisional.
    mimit_current_rules:
      url: https://www.mimit.gov.it/it/incentivi/credito-d-imposta-r-s
      content: Current statutory rates and administrative requirements; distinguish R&D from innovation and design.
    istat_business_rd_survey:
      url: https://www.istat.it/informazioni-sulla-rilevazione/ricerca-imprese/
      content: Annual business R&D intramural and extramural performance outcome.

  rd_tax_credit_impact:
    oecd_microberd_italy:
      url: https://www.oecd.org/content/dam/oecd/en/publications/reports/2023/10/the-impact-of-r-d-tax-incentives_bc42ab04/1937ac6b-en.pdf
      content: Italy difference-in-differences estimates for 2007-2009 volume-based and 2015-2019 incremental tax-credit regimes; historical causal benchmarks only.
    oecd_italy_survey_2026:
      url: https://www.oecd.org/en/publications/oecd-economic-surveys-italy-2026_539538b2-en/full-report/enhancing-business-dynamism-to-raise-productivity_ec8ed53a.html
      content: Reports tax incentives at 64% of total government support to business R&D in 2023; composition indicator, not causal additionality.
    bancaditalia_qef_898:
      url: https://www.bancaditalia.it/pubblicazioni/qef/2024-0898/
      content: Comparative analysis of innovation and public support policies, Italy and peer countries.

  macro_baseline:
    istat_2024_2025_release:
      url: https://www.istat.it/wp-content/uploads/2026/09/REPORT_RS_2026.pdf
      publication_date: 2026-09-24
      content: Revised 2024 intra-muros R&D total and sector breakdown; preliminary 2025 growth rates by selected performing sectors.
    istat_asi_2025_chapter_21:
      url: https://www.istat.it/storage/ASI/2025/capitoli/C21.pdf
      content: 2019-2023 intra-muros R&D total series and GDP intensity; 2024 earlier preliminary vintage explicitly superseded by September 2026 release.
    eurostat_gerd:
      dataset_code: rd_e_gerdtot
      url: https://ec.europa.eu/eurostat/databrowser/view/rd_e_gerdtot/default/table
      content: Cross-country harmonised GERD by sector of performance; use for validation and EU comparison.

  macro_outcome_convention:
    primary_indicator: GERD as percentage of GDP (R&D intensity), percentage points
    companion_indicators:
      - nominal GERD EUR million
      - nominal GDP EUR million
      - real GERD in 2019 prices
      - BERD_GDP
      - HERD_GDP
      - GOVERD_GDP
      - R&D personnel FTE
    eurostat_gerd:
      dataset_code: rd_e_gerdtot
      url: https://ec.europa.eu/eurostat/databrowser/view/rd_e_gerdtot/default/table
      preferred_unit: percentage_of_GDP
      note: Preferred harmonised master series for econometric and cross-country work; preserve observation flags and breaks.
    eurostat_gdp:
      dataset_code: nama_10_gdp
      url: https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table
      preferred_use: nominal GDP denominator and implicit GDP deflator; match price basis with GERD numerator.

# Initial source catalogue. Add exact document URLs and dataset identifiers as they are verified.
project:
  geography: IT
  historical_coverage_start: 2015
  historical_coverage_end: 2024
  constant_price_reference_year: 2019
  retain_nominal_series: true
  policy_scope:
    core: pnrr_plus_directly_associated_national_cofinancing
    exclude_unrelated_national_measures: true
    optional_eu_programmes:
      enabled: false
      programmes:
        - cohesion_policy
        - eic
  shock_horizon_start: 2021
  shock_horizon_end: 2030

source_families:
  pnrr:
    commission_country_page: https://reforms-investments.ec.europa.eu/recovery-and-resilience-facility-1/country-pages/italys-recovery-and-resilience-plan_en
    original_cid_2021:
      council_register_document_number: 10160/21
      annex_document_number: ST 10160 2021 ADD 1 REV 2
      source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=consil:ST_10160_2021_ADD_1_REV_2
      cid_source_url: https://data.consilium.europa.eu/doc/document/ST-10160-2021-INIT/en/pdf
    latest_cid_2026:
      adopted_version: August 2026
      council_document: ST 12357/26
      annex_document: ST 12357/26 ADD 1
      cid_url: https://reforms-investments.ec.europa.eu/document/download/e723ee8a-267f-4e5b-b857-ead3be9dddbf_en?filename=COM_2026_434_1_EN_ACT_part1_v3.pdf
      annex_url: https://reforms-investments.ec.europa.eu/document/download/0531155b-8019-459a-8892-7bb5a1cc5a69_en?filename=COM_2026_434_1_EN_annexe_proposition_cp_part1_v4.pdf
      source_page: https://reforms-investments.ec.europa.eu/recovery-and-resilience-facility-1/country-pages/italys-recovery-and-resilience-plan_en
      note: Use the adopted Council Implementing Decision and annex, not only the Commission proposal. Preserve the March 2026 and intermediate revisions for version history.
    source_documents:
      - name: Original Italian PNRR
        institution: Government of Italy
        expected_material: plan, annexes, measure tables
      - name: Council Implementing Decision 2021
        institution: Council of the European Union
        expected_material: CID and annexes
      - name: Revised Italian PNRR
        institution: Government of Italy
        expected_material: revised plan and annexes
      - name: Council Implementing Decision 2026
        institution: Council of the European Union
        expected_material: revised CID and annexes
  other_eu_programmes:
    cohesion_policy:
      enabled_by_default: false
      expected_material: programmes, priorities, calls, selected operations, payments and R&D-relevant beneficiary expenditure
    eic:
      enabled_by_default: false
      expected_material: EIC Pathfinder, Transition and Accelerator grant/equity components, award and beneficiary data
  implementation:
    italiadomani:
      portal: https://www.italiadomani.gov.it/
      open_data_catalogue_navigation: locate_from_portal_navigation
      expected_material: measures, projects, implementing bodies, tenders, awardees, calls and notices, financial framework, milestones and targets, implementation progress
    mimit_pnrr_incentives:
      portal: https://www.mimit.gov.it/it/pnrr/agevolazioni-pnrr
      expected_material: R&D tax credit, business incentives, venture-capital funds and PNRR implementation information
  legislation_and_budget:
    - name: Italian Budget Laws
      institution: Government of Italy
      expected_material: laws, budget tables, financial annexes
    - name: Implementing legislation
      institution: Relevant Italian administrations
      expected_material: decrees, allocation acts, implementing rules
  accounting:
    esa_2010_eurostat_methodology: https://ec.europa.eu/eurostat/web/government-finance-statistics/methodology
    manual_on_government_deficit_and_debt_2022: https://ec.europa.eu/eurostat/documents/3859598/16029761/KS-GQ-23-002-EN-N.pdf
    mef_rgs_openbdap_cash_and_national_accounts: https://openbdap.rgs.mef.gov.it/Home/ContiPubbliciContabilitaNazionale
    note: Preserve cash, commitments, ESA accrual recognition and beneficiary R&D performance as separate timing fields.
  statistics:
    eurostat:
      candidate_datasets:
        - rd_e_gerdact
        - rd_e_gerdtot
      note: Verify dataset codes, dimensions, units and current metadata before extraction.
    oecd:
      candidate_topics:
        - GERD
        - BERD
        - GOVERD
        - HERD
        - GERD by source of funds
        - GERD by type of R&D
        - GBARD
      note: Resolve exact OECD dataset and indicator identifiers from current OECD metadata.
  financial_instruments:
    - CDP
    - CDP Venture Capital
    - European Investment Bank
    - InvestEU

evidence_requirements:
  store_retrieval_date: true
  store_document_version: true
  store_page_or_provision: true
  store_source_url: true
  store_unit_and_price_basis: true
  require_human_validation_for_final_estimates: true
